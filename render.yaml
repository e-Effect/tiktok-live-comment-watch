services:
  - type: web
    name: tiktok-live-comment-watch
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tiktok-listener-ledger-db
          property: connectionString
      - key: LISTENER_ADMIN_KEY
        sync: false
databases:
  - name: tiktok-listener-ledger-db
    plan: free
    region: virginia
