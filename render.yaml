services:
  - type: web
    name: tiktok-live-comment-watch
    runtime: docker
    plan: free
    region: virginia
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tiktok-listener-ledger
          property: connectionString
      - key: LISTENER_ADMIN_KEY
        sync: false
      - key: LIVE_SOURCE
        value: collector
      - key: COLLECTOR_INGEST_KEY
        sync: false
databases:
  - name: tiktok-listener-ledger
    plan: basic-256mb
    region: virginia
